<text x="380" y="235" fill="#0b1220" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" text-anchor="start" font-weight="700">65,536 committed bytes</text>
<text x="1510" y="235" fill="#9fb0c9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" text-anchor="end" font-weight="400">seed closes cleanly</text>
