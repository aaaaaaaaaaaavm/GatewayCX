<text x="80" y="120" fill="#9fb0c9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" text-anchor="start" font-weight="400">S020 coordinated SIGKILL probe · SQLite WAL · synchronous FULL</text>
