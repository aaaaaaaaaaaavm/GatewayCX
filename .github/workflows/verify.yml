name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Reproduce committed scenarios
        run: python -m gatewaycx.cli run-all
      - name: Reproduce deterministic IP-DTN disruption replay
        run: python -m gatewaycx.disruption
      - name: Reproduce deterministic capacity envelope
        run: python -m gatewaycx.capacity
      - name: Reproduce deterministic service placement
        run: python -m gatewaycx.placement
      - name: Reproduce deterministic contact admission
        run: python -m gatewaycx.admission
      - name: Reproduce deterministic RF-optical handover
        run: python -m gatewaycx.handover
      - name: Reproduce deterministic update delivery
        run: python -m gatewaycx.update_delivery
      - name: Reproduce deterministic predictive prepositioning
        run: python -m gatewaycx.preposition
      - name: Reproduce deterministic lunar black start
        run: python -m gatewaycx.black_start
      - name: Reproduce and validate GX-O1 diagnostic trace
        run: |
          python -m gatewaycx.diagnostics
          python -m gatewaycx.diagnostics --validate results/S014_diagnostic_trace.json
      - name: Reproduce integrated recovery replay
        run: python -m gatewaycx.integrated_replay
      - name: Exercise profile-backed bearer adapters
        run: python -m gatewaycx.adapter_probe
      - name: Exercise cross-process durable traffic ledger
        run: python -m gatewaycx.durable_restart
      - name: Check bearer capability profiles
        run: python -m gatewaycx.conformance profiles/bearers/*.json
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Audit engineering record
        run: python -m gatewaycx.cli audit
      - name: Check generated record
        run: git diff --exit-code -- results/baseline.json results/S005_disruption.json results/S006_capacity_envelope.json results/S007_service_placement.json results/S009_admission.json results/S010_handover.json results/S011_update_delivery.json results/S012_prepositioning.json results/S013_black_start.json results/S014_diagnostic_trace.json results/S015_integrated_replay.json results/S016_adapter_probe.json results/S017_durable_restart.json profiles/diagnostics/gx-o1-fault-codes.json
