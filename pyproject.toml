[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gatewaycx"
version = "0.1.0.dev0"
description = "Executable reference studies for a native Earth-Moon Internet"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary"}
authors = [
  {name = "Adityavardhan Mishra"}
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: Other/Proprietary License",
  "Programming Language :: Python :: 3",
  "Topic :: Communications"
]
dependencies = []

[project.optional-dependencies]
lab = [
  "aioquic==1.3.0",
  "h2==4.3.0",
]

[project.scripts]
gatewaycx = "gatewaycx.cli:main"

[tool.setuptools.packages.find]
include = ["gatewaycx*"]
