<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title">
<title id="title">GatewayCX system architecture</title>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#4f8cff"/></marker></defs>
<rect x="0" y="0" width="1600" height="760" rx="0" fill="#0b1220" stroke="none" stroke-width="0"/>
<text x="80" y="82" fill="#edf4ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" text-anchor="start" font-weight="700">ONE INTERNET, TWO AUTONOMOUS REGIONS</text>
<text x="80" y="120" fill="#9fb0c9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" text-anchor="start" font-weight="400">ordinary IP when continuous · durable delivery when interrupted</text>
<rect x="80" y="220" width="315" height="300" rx="18" fill="#121d31" stroke="#4f8cff" stroke-width="3"/>
<rect x="104" y="248" width="72" height="8" rx="4" fill="#4f8cff" stroke="none" stroke-width="0"/>
<text x="104" y="300" fill="#4f8cff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" text-anchor="start" font-weight="700">EARTH REGION</text>
<text x="104" y="370" fill="#edf4ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="29" text-anchor="start" font-weight="650">Internet + cloud</text>
<text x="104" y="415" fill="#9fb0c9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" text-anchor="start" font-weight="400">DNS · identity · services</text>
<rect x="455" y="220" width="315" height="300" rx="18" fill="#121d31" stroke="#31d2c2" stroke-width="3"/>
<rect x="479" y="248" width="72" height="8" rx="4" fill="#31d2c2" stroke="none" stroke-width="0"/>
<text x="479" y="300" fill="#31d2c2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" text-anchor="start" font-weight="700">CISLUNAR BACKBONE</text>
<text x="479" y="370" fill="#edf4ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="29" text-anchor="start" font-weight="650">optical + RF</text>
<text x="479" y="415" fill="#9fb0c9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" text-anchor="start" font-weight="400">GX-A1 adapters · DTN</text>
<rect x="830" y="220" width="315" height="300" rx="18" fill="#121d31" stroke="#ffbf47" stroke-width="3"/>
<rect x="854" y="248" width="72" height="8" rx="4" fill="#ffbf47" stroke="none" stroke-width="0"/>
<text x="854" y="300" fill="#ffbf47" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" text-anchor="start" font-weight="700">LUNAR REGION</text>
<text x="854" y="370" fill="#edf4ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="29" text-anchor="start" font-weight="650">routing + access</text>
<text x="854" y="415" fill="#9fb0c9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" text-anchor="start" font-weight="400">habitats · landers · crews</text>
<rect x="1205" y="220" width="315" height="300" rx="18" fill="#121d31" stroke="#ff6b6b" stroke-width="3"/>
<rect x="1229" y="248" width="72" height="8" rx="4" fill="#ff6b6b" stroke="none" stroke-width="0"/>
<text x="1229" y="300" fill="#ff6b6b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" text-anchor="start" font-weight="700">LUNAR COMPUTE</text>
<text x="1229" y="370" fill="#edf4ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="29" text-anchor="start" font-weight="650">cache + replicas</text>
<text x="1229" y="415" fill="#9fb0c9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" text-anchor="start" font-weight="400">local services · data centre</text>
<line x1="395" y1="370" x2="445" y2="370" stroke="#4f8cff" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="450" y1="410" x2="400" y2="410" stroke="#31d2c2" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)" stroke-dasharray="10 10"/>
<line x1="770" y1="370" x2="820" y2="370" stroke="#4f8cff" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="825" y1="410" x2="775" y2="410" stroke="#31d2c2" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)" stroke-dasharray="10 10"/>
<line x1="1145" y1="370" x2="1195" y2="370" stroke="#4f8cff" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="1200" y1="410" x2="1150" y2="410" stroke="#31d2c2" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)" stroke-dasharray="10 10"/>
<rect x="80" y="590" width="1440" height="92" rx="18" fill="#0e1829" stroke="#31415f" stroke-width="2"/>
<text x="110" y="628" fill="#31d2c2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" text-anchor="start" font-weight="700">DESIGN RULE</text>
<text x="110" y="662" fill="#edf4ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" text-anchor="start" font-weight="400">same names and identities · same applications · no vendor owns the service plane</text>
</svg>
