name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Reproduce committed scenarios
        run: python -m gatewaycx.cli run-all
      - name: Reproduce deterministic capacity envelope
        run: python -m gatewaycx.capacity
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Audit engineering record
        run: python -m gatewaycx.cli audit
      - name: Check generated record
        run: git diff --exit-code -- results/baseline.json results/S006_capacity_envelope.json
